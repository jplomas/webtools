<!DOCTYPE html>
<html lang="en" data-theme="qrl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QRL Web Tools</title>
    <script>
      // Reject on timeout so a truncated download or a browser without
      // WebAssembly produces a visible error rather than an endless spinner.
      window.qrllibReady = new Promise((resolve, reject) => {
        let qrllib;
        var timeout = setTimeout(function () {
          reject(new Error('The QRL cryptography library did not finish loading.'));
        }, 15000);
        Object.defineProperty(window, 'QRLLIB', {
          configurable: true,
          get() { return qrllib; },
          set(value) {
            qrllib = value;
            if (typeof value?.str2bin === 'function') {
              clearTimeout(timeout);
              resolve(value);
            }
          }
        });
      });
    </script>
    <script src="./qrllib.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
