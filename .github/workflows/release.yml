name: Release QRL Web Tools

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag to publish
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # mint the OIDC token for provenance
      attestations: write # publish the provenance attestation
    steps:
      - name: Validate tag shape
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::Refusing tag '$TAG': expected vMAJOR.MINOR.PATCH"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag signature against maintainer allowlist
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          count_entries() {
            [ -f "$1" ] || { echo 0; return; }
            grep -cvE '^[[:space:]]*(#|$)' "$1" || true
          }
          pgp_keys=$(count_entries .github/maintainer-keys.asc)
          ssh_keys=$(count_entries .github/allowed-signers)
          if [ "$pgp_keys" -eq 0 ] && [ "$ssh_keys" -eq 0 ]; then
            echo "::error::No maintainer signing keys configured"
            exit 1
          fi
          verified=0
          if [ "$pgp_keys" -gt 0 ]; then
            gpg --batch --quiet --import .github/maintainer-keys.asc
            if git verify-tag "$TAG" 2>/dev/null; then verified=1; fi
          fi
          if [ "$verified" = 0 ] && [ "$ssh_keys" -gt 0 ]; then
            git config gpg.ssh.allowedSignersFile .github/allowed-signers
            if git -c gpg.format=ssh verify-tag "$TAG" 2>/dev/null; then verified=1; fi
          fi
          [ "$verified" = 1 ] || { echo "::error::$TAG is not signed by an allowed maintainer key"; exit 1; }

      - name: Verify package version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [ "${TAG#v}" = "$VERSION" ] || { echo "::error::$TAG does not match package version $VERSION"; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run check:offline

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser

      - name: Bundle release artefact
        id: artefact
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # <product>_<tag>… naming, matching other theQRL releases. Verifiers
          # read the product from the first underscore-separated segment to work
          # out which signing context applies, so the underscore is load-bearing.
          NAME="qrl-webtools_v${VERSION}.zip"
          zip -j "$NAME" dist/index.html
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "signatures=qrl-webtools_v${VERSION}_signatures.txt" >> "$GITHUB_OUTPUT"

      # FIPS 204 signature over the actual release bundle, made with theQRL
      # organisation release key. Every product signs under its own
      # <product>-release-signatures context, which is permanent: changing it
      # invalidates every signature already published against it.
      - name: Sign bundle with ML-DSA-87
        uses: theQRL/actions-mldsa-sign@97a05abefff417d595c28c7b5d9d886ebe2fe9d0 # v1.0.0
        with:
          patterns: ${{ steps.artefact.outputs.name }}
          hexseed: ${{ secrets.MLDSA_HEXSEED }}
          context: qrl-webtools-release-signatures
          output: ${{ steps.artefact.outputs.signatures }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.artefact.outputs.name }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          NAME: ${{ steps.artefact.outputs.name }}
          SIGNATURES: ${{ steps.artefact.outputs.signatures }}
        run: |
          test -f "$NAME" || { echo "::error::$NAME missing"; exit 1; }
          test -s "$SIGNATURES" || { echo "::error::ML-DSA signature missing"; exit 1; }
          gh release create "$TAG" "$NAME" "$SIGNATURES" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
